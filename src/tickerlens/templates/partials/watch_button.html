{# Watch toggle button. Swapped in place via HTMX; plain POST works without JS. #}
<form method="post" action="/company/{{ ticker }}/watch{% if watching %}/remove{% endif %}"
      hx-post="/company/{{ ticker }}/watch{% if watching %}/remove{% endif %}"
      hx-swap="outerHTML" class="inline">
  <button type="submit"
          class="rounded-xl border px-4 py-2 text-xs font-semibold transition shadow-xs cursor-pointer {% if watching %}border-amber-300 dark:border-amber-800/80 bg-amber-50 dark:bg-amber-950/50 text-amber-700 dark:text-amber-300 hover:bg-amber-100 dark:hover:bg-amber-900/40{% else %}border-slate-200 dark:border-gray-700 bg-white dark:bg-gray-900 text-slate-700 dark:text-gray-300 hover:bg-slate-50 dark:hover:bg-gray-800 hover:border-slate-300 dark:hover:border-gray-600{% endif %}">
    {% if watching %}★ Watching{% else %}☆ Watch{% endif %}
  </button>
</form>
