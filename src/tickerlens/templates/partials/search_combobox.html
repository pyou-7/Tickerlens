{# Reusable Company Search Combobox Component (PRD §4.10) #}
{% set is_nav = (mode == "nav") %}
{% set input_id_val = input_id or ('nav-search-input' if is_nav else 'hero-search-input') %}

<div x-data="companyCombobox({ isNav: {{ 'true' if is_nav else 'false' }}, inputId: '{{ input_id_val }}' })"
     @click.outside="close()"
     @keydown.escape.prevent="close()"
     class="relative w-full {{ 'max-w-xs sm:max-w-sm' if is_nav else 'max-w-xl' }}">

  <!-- Input Wrapper -->
  <div class="relative flex items-center">
    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
      <svg class="{{ 'w-4 h-4' if is_nav else 'w-5 h-5' }}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    </div>

    <input id="{{ input_id_val }}"
           type="text"
           x-ref="searchInput"
           x-model="query"
           @input.debounce.150ms="onInput()"
           @focus="onFocus()"
           @keydown.arrow-down.prevent="navigateDown()"
           @keydown.arrow-up.prevent="navigateUp()"
           @keydown.enter.prevent="selectCurrent()"
           placeholder="{{ 'Search company (⌘K)...' if is_nav else 'Search 10,000+ US public companies by ticker or name...' }}"
           class="w-full bg-gray-900 border border-gray-700 rounded-xl text-white placeholder-gray-500
                  focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent
                  transition-all duration-150
                  {{ 'pl-9 pr-14 py-1.5 text-sm h-9' if is_nav else 'pl-11 pr-20 py-3 text-base shadow-lg' }}"
           autocomplete="off"
           autocapitalize="off"
           spellcheck="false"
           {{ 'autofocus' if not is_nav else '' }} />

    <!-- Keyboard Shortcut Hint -->
    <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
      <kbd class="text-[10px] font-mono font-medium text-gray-400 bg-gray-800 border border-gray-700/80 rounded px-1.5 py-0.5 shadow-sm">
        ⌘K
      </kbd>
    </div>
  </div>


  <!-- Suggestions Dropdown -->
  <div x-show="isOpen"
       x-cloak
       x-transition:enter="transition ease-out duration-100"
       x-transition:enter-start="opacity-0 scale-95"
       x-transition:enter-end="opacity-100 scale-100"
       x-transition:leave="transition ease-in duration-75"
       x-transition:leave-start="opacity-100 scale-100"
       x-transition:leave-end="opacity-0 scale-95"
       class="absolute left-0 right-0 mt-2 z-50 rounded-xl bg-gray-900 border border-gray-800 shadow-2xl overflow-hidden divide-y divide-gray-800/60 max-h-80 overflow-y-auto">

    <!-- Loading State -->
    <div x-show="isLoading" class="px-4 py-3 text-xs text-gray-400 flex items-center gap-2">
      <svg class="animate-spin h-3.5 w-3.5 text-indigo-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
      </svg>
      Searching SEC universe...
    </div>

    <!-- Results List -->
    <template x-if="!isLoading && results.length > 0">
      <ul class="py-1" x-ref="resultsList">
        <template x-for="(item, index) in results" :key="item.ticker + item.cik">
          <li @click="selectCompany(item.ticker)"
              @mouseenter="selectedIndex = index"
              :id="'suggestion-' + index"
              :class="{ 'bg-indigo-600/25 text-white': selectedIndex === index, 'text-gray-300 hover:bg-gray-800/60': selectedIndex !== index }"
              class="px-4 py-2.5 flex items-center justify-between cursor-pointer text-sm transition-colors duration-75">
            <div class="flex items-center gap-3 min-w-0 pr-2">
              <span class="font-mono font-bold tracking-wider px-2 py-0.5 rounded bg-gray-800 text-indigo-300 text-xs shrink-0"
                    x-html="highlight(item.ticker, query)">
              </span>
              <span class="truncate font-medium" x-html="highlight(item.name, query)"></span>
            </div>
            <div class="flex items-center gap-2 shrink-0 text-xs text-gray-500">
              <template x-if="item.market_cap">
                <span class="hidden sm:inline px-1.5 py-0.5 rounded bg-gray-800/80 text-gray-400 font-mono text-[11px]"
                      x-text="formatCap(item.market_cap)">
                </span>
              </template>
              <span class="font-mono text-[11px] text-gray-600">CIK <span x-text="item.cik.replace(/^0+/, '')"></span></span>
            </div>
          </li>
        </template>
      </ul>
    </template>

    <!-- Empty State -->
    <div x-show="!isLoading && hasSearched && results.length === 0"
         class="px-4 py-4 text-center text-xs text-gray-400">
      No companies found for "<span class="text-white font-medium" x-text="query"></span>"
    </div>
  </div>
</div>

<script>
if (typeof window.companyCombobox === 'undefined') {
  window.companyCombobox = function(config) {
    return {
      isNav: config.isNav || false,
      inputId: config.inputId,
      query: '',
      results: [],
      selectedIndex: -1,
      isOpen: false,
      isLoading: false,
      hasSearched: false,

      onFocus() {
        if (this.query.trim().length > 0) {
          this.isOpen = true;
        }
      },

      async onInput() {
        const q = this.query.trim();
        if (!q) {
          this.results = [];
          this.isOpen = false;
          this.hasSearched = false;
          this.selectedIndex = -1;
          return;
        }

        this.isLoading = true;
        this.isOpen = true;
        try {
          const resp = await fetch('/api/search?q=' + encodeURIComponent(q) + '&limit=8');
          if (resp.ok) {
            this.results = await resp.json();
            this.hasSearched = true;
            this.selectedIndex = this.results.length > 0 ? 0 : -1;
          }
        } catch (err) {
          console.error('Search error:', err);
        } finally {
          this.isLoading = false;
        }
      },

      navigateDown() {
        if (!this.isOpen && this.results.length > 0) {
          this.isOpen = true;
          this.selectedIndex = 0;
          return;
        }
        if (this.results.length === 0) return;
        this.selectedIndex = (this.selectedIndex + 1) % this.results.length;
        this.scrollToSelected();
      },

      navigateUp() {
        if (this.results.length === 0) return;
        this.selectedIndex = this.selectedIndex <= 0 ? this.results.length - 1 : this.selectedIndex - 1;
        this.scrollToSelected();
      },

      scrollToSelected() {
        this.$nextTick(() => {
          const el = document.getElementById('suggestion-' + this.selectedIndex);
          if (el) {
            el.scrollIntoView({ block: 'nearest' });
          }
        });
      },

      selectCurrent() {
        if (this.selectedIndex >= 0 && this.results[this.selectedIndex]) {
          this.selectCompany(this.results[this.selectedIndex].ticker);
        } else if (this.results.length > 0) {
          const qUpper = this.query.trim().toUpperCase();
          const exact = this.results.find(r => r.ticker.toUpperCase() === qUpper);
          this.selectCompany(exact ? exact.ticker : this.results[0].ticker);
        } else if (this.query.trim()) {
          this.selectCompany(this.query.trim().toUpperCase());
        }
      },

      selectCompany(ticker) {
        if (!ticker) return;
        this.close();
        window.location.href = '/company/' + encodeURIComponent(ticker.toUpperCase());
      },

      close() {
        this.isOpen = false;
        this.selectedIndex = -1;
      },

      formatCap(val) {
        if (!val) return '';
        const abs = Math.abs(val);
        if (abs >= 1e12) return '$' + (abs / 1e12).toFixed(2) + 'T';
        if (abs >= 1e9) return '$' + (abs / 1e9).toFixed(1) + 'B';
        if (abs >= 1e6) return '$' + (abs / 1e6).toFixed(0) + 'M';
        return '$' + abs.toFixed(0);
      },

      escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      },

      highlight(text, q) {
        if (!text) return '';
        if (!q || !q.trim()) return this.escapeHtml(text);

        const queryClean = q.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        if (!queryClean) return this.escapeHtml(text);

        try {
          const regex = new RegExp('(' + queryClean + ')', 'gi');
          return text.split(regex).map(part => {
            if (part.toLowerCase() === q.trim().toLowerCase()) {
              return '<mark class="bg-indigo-900/80 text-indigo-200 px-0.5 rounded font-semibold">' + this.escapeHtml(part) + '</mark>';
            }
            return this.escapeHtml(part);
          }).join('');
        } catch (e) {
          return this.escapeHtml(text);
        }
      }
    };
  };
}
</script>
