{# Watchlist tags (PRD §4.6). Inline editor on the Overview page —
   HTMX swaps this partial in place; plain POST redirects back. #}
<div id="watch-tags" class="space-y-1.5 pt-2 border-t border-slate-100 dark:border-gray-800/70">
  {% if tags %}
  <div class="flex flex-wrap gap-1">
    {% for tag in tags %}
    <span class="rounded bg-indigo-50 dark:bg-indigo-950/60 border border-indigo-200/80 dark:border-indigo-800/60 px-2 py-0.5 text-indigo-600 dark:text-indigo-300 font-medium text-[11px]">#{{ tag }}</span>
    {% endfor %}
  </div>
  {% endif %}
  <form method="post" action="/company/{{ ticker }}/watch/tags"
        hx-post="/company/{{ ticker }}/watch/tags" hx-target="#watch-tags" hx-swap="outerHTML"
        class="flex gap-1.5">
    <input type="text" name="tags" value="{{ tags|join(', ') }}" maxlength="120"
           placeholder="Tags (e.g. ai, core)…"
           aria-label="Watchlist tags"
           class="min-w-0 flex-1 rounded-lg bg-slate-50 dark:bg-gray-950 border border-slate-200 dark:border-gray-800 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-gray-500 text-xs px-2.5 py-1.5 focus:outline-none focus:ring-1 focus:ring-indigo-500" />
    <button type="submit"
            class="shrink-0 rounded-lg border border-slate-200 dark:border-gray-800 bg-white dark:bg-gray-800 px-2.5 py-1.5 text-xs font-semibold text-slate-600 dark:text-gray-300 hover:text-indigo-600 dark:hover:text-indigo-400 transition cursor-pointer">
      Save
    </button>
  </form>
</div>
