{# Watchlist note (PRD §4.6). Inline edit form on the Overview page —
   HTMX swaps this partial in place; plain POST redirects back. #}
<div id="watch-note" class="mt-2 max-w-md">
  {% if note %}
  <p class="text-sm text-gray-300 italic">“{{ note }}”</p>
  {% endif %}
  <form method="post" action="/company/{{ ticker }}/watch/note"
        hx-post="/company/{{ ticker }}/watch/note" hx-target="#watch-note" hx-swap="outerHTML"
        class="flex gap-2 mt-1">
    <input type="text" name="note" value="{{ note or '' }}" maxlength="280"
           placeholder="Add a note… (why you're watching)"
           aria-label="Watchlist note"
           class="flex-1 rounded-lg bg-gray-800 border border-gray-700 text-white text-sm px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
    <button type="submit"
            class="rounded-lg border border-gray-700 px-3 py-1.5 text-sm text-gray-300 hover:bg-gray-800 transition">
      Save
    </button>
  </form>
</div>
