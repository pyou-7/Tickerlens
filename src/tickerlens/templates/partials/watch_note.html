{# Watchlist note (PRD §4.6). Inline edit form on the Overview page —
   HTMX swaps this partial in place; plain POST redirects back. #}
<div id="watch-note" class="mt-3 max-w-md">
  {% if note %}
  <p class="text-xs text-slate-600 dark:text-gray-300 italic mb-1.5 flex items-start gap-1">
    <span class="text-indigo-500">“</span><span>{{ note }}</span><span class="text-indigo-500">”</span>
  </p>
  {% endif %}
  <form method="post" action="/company/{{ ticker }}/watch/note"
        hx-post="/company/{{ ticker }}/watch/note" hx-target="#watch-note" hx-swap="outerHTML"
        class="flex gap-2">
    <input type="text" name="note" value="{{ note or '' }}" maxlength="280"
           placeholder="Add investment note… (e.g. tracking buyback, catalyst in Q4)"
           aria-label="Watchlist note"
           class="flex-1 rounded-xl bg-slate-50 dark:bg-gray-900 border border-slate-200 dark:border-gray-700 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-gray-500 text-xs px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 shadow-inner" />
    <button type="submit"
            class="rounded-xl border border-slate-200 dark:border-gray-700 bg-white dark:bg-gray-800 px-3 py-1.5 text-xs font-semibold text-slate-700 dark:text-gray-300 hover:bg-slate-50 dark:hover:bg-gray-700 hover:border-slate-300 dark:hover:border-gray-600 transition shadow-xs cursor-pointer">
      Save Note
    </button>
  </form>
</div>
