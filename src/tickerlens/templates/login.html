<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tickerlens — Enter passcode</title>

  <!-- Prevent FOUC: Apply dark class immediately before render -->
  <script>
    (function() {
      try {
        const storedTheme = localStorage.getItem('tickerlens_theme');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (storedTheme === 'dark' || (!storedTheme && systemDark) || (storedTheme === 'system' && systemDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            },
            surface: {
              light: '#ffffff',
              dark: '#0e1017',
              darker: '#090a0f',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="h-full text-slate-900 dark:text-gray-100 font-sans antialiased bg-slate-50 dark:bg-[#090a0f] selection:bg-indigo-500/20 dark:selection:bg-indigo-500/30">
  <div class="min-h-full flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-sm rounded-3xl bg-white dark:bg-gray-900 border border-slate-200/90 dark:border-gray-800 p-8 shadow-2xl space-y-6">
      <div class="flex flex-col items-center gap-3 text-center">
        <span class="w-11 h-11 rounded-2xl bg-indigo-600/10 dark:bg-indigo-600/25 border border-indigo-500/30 dark:border-indigo-500/40 text-indigo-600 dark:text-indigo-300 flex items-center justify-center text-sm font-mono font-bold shadow-sm">TL</span>
        <div>
          <h1 class="text-lg font-extrabold tracking-tight text-slate-900 dark:text-white">Tickerlens</h1>
          <p class="text-xs text-slate-500 dark:text-gray-400 mt-1">This site is shared privately.<br />Enter the passcode to continue.</p>
        </div>
      </div>

      {% if error %}
      <div class="rounded-xl bg-red-50 dark:bg-red-500/10 border border-red-200 dark:border-red-500/30 px-3.5 py-2.5 text-xs font-medium text-red-700 dark:text-red-300 text-center">
        Incorrect passcode. Try again.
      </div>
      {% endif %}

      <form method="post" action="/login" class="space-y-4">
        <input type="hidden" name="next" value="{{ next }}" />
        <div>
          <label for="passcode" class="sr-only">Passcode</label>
          <input type="password" id="passcode" name="passcode" placeholder="Passcode" autocomplete="current-password"
                 autofocus required
                 class="w-full rounded-xl bg-slate-100 dark:bg-gray-950 border border-slate-200 dark:border-gray-800 px-3.5 py-2.5 text-sm text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 dark:focus:ring-indigo-500/60 focus:bg-white dark:focus:bg-gray-900 transition shadow-inner" />
        </div>
        <button type="submit"
                class="w-full rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold py-2.5 transition shadow-sm cursor-pointer">
          Continue
        </button>
      </form>

      <p class="text-[11px] text-slate-400 dark:text-gray-500 text-center">Your browser remembers the passcode for 30 days.</p>
    </div>
  </div>
</body>
</html>
