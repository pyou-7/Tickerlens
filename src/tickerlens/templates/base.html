<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Tickerlens — Financial Research{% endblock %}</title>

  <!-- Prevent FOUC: Apply dark class immediately before render -->
  <script>
    (function() {
      try {
        const storedTheme = localStorage.getItem('tickerlens_theme');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (storedTheme === 'dark' || (!storedTheme && systemDark) || (storedTheme === 'system' && systemDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* Global tabular numbers alignment */
    .tabular-nums { font-variant-numeric: tabular-nums; }
    
    /* Top Progress Bar for HTMX Requests */
    #htmx-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 2.5px;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #818cf8, #a855f7);
      transition: width 250ms ease, opacity 350ms ease;
      z-index: 9999;
      pointer-events: none;
      opacity: 0;
    }
    body.htmx-request #htmx-progress {
      width: 75%;
      opacity: 1;
    }

    [x-cloak] { display: none !important; }
  </style>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  {% block extra_head %}{% endblock %}
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="h-full text-slate-900 dark:text-gray-100 font-sans antialiased bg-slate-50 dark:bg-gray-950 selection:bg-indigo-500/20 dark:selection:bg-indigo-500/30 selection:text-indigo-900 dark:selection:text-indigo-200 transition-colors duration-150"
      x-data="{
        shortcutsOpen: false,
        toasts: [],
        addToast(msg, type='info', duration=3200) {
          const id = Date.now() + Math.random();
          this.toasts.push({ id, msg, type });
          setTimeout(() => {
            this.removeToast(id);
          }, duration);
        },
        removeToast(id) {
          this.toasts = this.toasts.filter(t => t.id !== id);
        }
      }"
      @show-toast.window="addToast($event.detail.msg, $event.detail.type || 'info', $event.detail.duration || 3200)"
      @toggle-shortcuts.window="shortcutsOpen = !shortcutsOpen"
      @keydown.window.escape="shortcutsOpen = false">
  <!-- Top HTMX Progress Bar -->
  <div id="htmx-progress"></div>

  <!-- Global Nav -->
  <nav class="border-b border-slate-200/80 dark:border-gray-800/80 bg-white/85 dark:bg-gray-950/85 backdrop-blur-xl sticky top-0 z-40 transition-colors duration-150 shadow-sm dark:shadow-none">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 flex items-center justify-between h-14 gap-4">
      <div class="flex items-center gap-6">
        <a href="/" class="flex items-center gap-2.5 text-indigo-600 dark:text-indigo-400 font-extrabold tracking-tight text-lg hover:text-indigo-500 dark:hover:text-indigo-300 transition shrink-0">
          <span class="w-7 h-7 rounded-lg bg-indigo-600/10 dark:bg-indigo-600/25 border border-indigo-500/30 dark:border-indigo-500/40 text-indigo-600 dark:text-indigo-300 flex items-center justify-center text-xs font-mono font-bold shadow-sm">TL</span>
          <span class="text-slate-900 dark:text-white font-bold">Tickerlens</span>
        </a>
      </div>

      <div class="flex items-center gap-2.5 sm:gap-3">
        <!-- Search Combobox Container in persistent header -->
        <div class="relative w-52 sm:w-72">
          <input data-search-combobox type="text" placeholder="Search ticker or company…"
                 aria-label="Search companies"
                 id="nav-search-input"
                 class="w-full rounded-xl bg-slate-100 dark:bg-gray-900 border border-slate-200 dark:border-gray-800 pl-3.5 pr-10 py-1.5 text-xs text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 dark:focus:ring-indigo-500/60 focus:bg-white dark:focus:bg-gray-950 transition shadow-inner" />
          <kbd class="pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2 rounded-md border border-slate-200 dark:border-gray-800 bg-white dark:bg-gray-950 px-1.5 py-0.5 text-[10px] font-mono text-slate-400 dark:text-gray-500 shadow-xs">⌘K</kbd>
        </div>

        <!-- Keyboard Shortcuts Help Button -->
        <button type="button" @click="shortcutsOpen = true"
                class="hidden sm:flex items-center justify-center w-8 h-8 rounded-xl border border-slate-200/80 dark:border-gray-800 bg-slate-100 dark:bg-gray-900 text-slate-500 dark:text-gray-400 hover:text-indigo-600 dark:hover:text-indigo-400 text-xs font-mono transition shadow-inner cursor-pointer"
                title="Keyboard Shortcuts (?)">
          ?
        </button>

        <!-- Theme Switcher: Light / Dark / System -->
        <div x-data="{
          theme: localStorage.getItem('tickerlens_theme') || 'system',
          setTheme(t) {
            this.theme = t;
            localStorage.setItem('tickerlens_theme', t);
            const isDark = (t === 'dark') || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) {
              document.documentElement.classList.add('dark');
            } else {
              document.documentElement.classList.remove('dark');
            }
            window.dispatchEvent(new CustomEvent('theme-changed', { detail: { theme: t, isDark: isDark } }));
          },
          init() {
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
              if (this.theme === 'system') {
                if (e.matches) {
                  document.documentElement.classList.add('dark');
                } else {
                  document.documentElement.classList.remove('dark');
                }
                window.dispatchEvent(new CustomEvent('theme-changed', { detail: { theme: 'system', isDark: e.matches } }));
              }
            });
          }
        }" class="flex items-center bg-slate-100 dark:bg-gray-900 border border-slate-200/80 dark:border-gray-800 rounded-xl p-0.5 text-xs shadow-inner">
          <!-- Light Mode Button -->
          <button type="button"
                  @click="setTheme('light')"
                  :class="theme === 'light' ? 'bg-white dark:bg-gray-800 text-amber-500 shadow-sm' : 'text-slate-400 hover:text-slate-600 dark:hover:text-gray-300'"
                  class="p-1.5 rounded-lg transition cursor-pointer"
                  title="Light mode">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
          </button>

          <!-- Dark Mode Button -->
          <button type="button"
                  @click="setTheme('dark')"
                  :class="theme === 'dark' ? 'bg-white dark:bg-gray-800 text-indigo-400 shadow-sm' : 'text-slate-400 hover:text-slate-600 dark:hover:text-gray-300'"
                  class="p-1.5 rounded-lg transition cursor-pointer"
                  title="Dark mode">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
          </button>

          <!-- System Default Button -->
          <button type="button"
                  @click="setTheme('system')"
                  :class="theme === 'system' ? 'bg-white dark:bg-gray-800 text-indigo-600 dark:text-indigo-400 shadow-sm' : 'text-slate-400 hover:text-slate-600 dark:hover:text-gray-300'"
                  class="p-1.5 rounded-lg transition cursor-pointer"
                  title="System default">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main content -->
  <main class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-8">
    {% block content %}{% endblock %}
  </main>

  <!-- Interactive Toast Notification Container -->
  <div class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm pointer-events-none">
    <template x-for="t in toasts" :key="t.id">
      <div class="pointer-events-auto flex items-center justify-between gap-3 px-4 py-3 rounded-2xl bg-white/95 dark:bg-gray-900/95 border border-slate-200/90 dark:border-gray-800 text-slate-800 dark:text-gray-100 shadow-xl backdrop-blur-xl text-xs font-medium transition-all duration-200 animate-in slide-in-from-bottom-2">
        <div class="flex items-center gap-2.5">
          <template x-if="t.type === 'success'">
            <span class="w-5 h-5 rounded-full bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 flex items-center justify-center shrink-0 font-bold">✓</span>
          </template>
          <template x-if="t.type === 'warning'">
            <span class="w-5 h-5 rounded-full bg-amber-500/10 text-amber-600 dark:text-amber-400 flex items-center justify-center shrink-0 font-bold">!</span>
          </template>
          <template x-if="t.type === 'info'">
            <span class="w-5 h-5 rounded-full bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 flex items-center justify-center shrink-0 font-bold">ℹ</span>
          </template>
          <span x-text="t.msg"></span>
        </div>
        <button @click="removeToast(t.id)" class="text-slate-400 hover:text-slate-600 dark:hover:text-gray-200 p-0.5 transition cursor-pointer">✕</button>
      </div>
    </template>
  </div>

  <!-- Keyboard Shortcuts Help Modal -->
  <div x-show="shortcutsOpen" x-cloak
       class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 dark:bg-black/70 backdrop-blur-sm"
       @click.self="shortcutsOpen = false">
    <div class="w-full max-w-md rounded-3xl bg-white dark:bg-gray-900 border border-slate-200/90 dark:border-gray-800 p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-gray-800">
        <div class="flex items-center gap-2.5">
          <span class="w-7 h-7 rounded-xl bg-indigo-600/10 dark:bg-indigo-600/25 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-xs font-mono font-bold">⌘</span>
          <h3 class="text-sm font-bold text-slate-900 dark:text-white">Keyboard Shortcuts</h3>
        </div>
        <button @click="shortcutsOpen = false" class="text-slate-400 hover:text-slate-600 dark:hover:text-gray-300 p-1 cursor-pointer">✕</button>
      </div>
      <div class="space-y-2 text-xs">
        <div class="flex items-center justify-between py-2 px-2.5 rounded-xl hover:bg-slate-50 dark:hover:bg-gray-800/40">
          <span class="text-slate-600 dark:text-gray-300">Quick Search</span>
          <kbd class="font-mono bg-slate-100 dark:bg-gray-800 px-2 py-0.5 rounded text-[11px] border border-slate-200 dark:border-gray-700 font-semibold">⌘K / Ctrl+K</kbd>
        </div>
        <div class="flex items-center justify-between py-2 px-2.5 rounded-xl hover:bg-slate-50 dark:hover:bg-gray-800/40">
          <span class="text-slate-600 dark:text-gray-300">Toggle Theme (Light / Dark / System)</span>
          <kbd class="font-mono bg-slate-100 dark:bg-gray-800 px-2 py-0.5 rounded text-[11px] border border-slate-200 dark:border-gray-700 font-semibold">T</kbd>
        </div>
        <div class="flex items-center justify-between py-2 px-2.5 rounded-xl hover:bg-slate-50 dark:hover:bg-gray-800/40">
          <span class="text-slate-600 dark:text-gray-300">Go to Home</span>
          <kbd class="font-mono bg-slate-100 dark:bg-gray-800 px-2 py-0.5 rounded text-[11px] border border-slate-200 dark:border-gray-700 font-semibold">G then H</kbd>
        </div>
        <div class="flex items-center justify-between py-2 px-2.5 rounded-xl hover:bg-slate-50 dark:hover:bg-gray-800/40">
          <span class="text-slate-600 dark:text-gray-300">Show Shortcuts Help</span>
          <kbd class="font-mono bg-slate-100 dark:bg-gray-800 px-2 py-0.5 rounded text-[11px] border border-slate-200 dark:border-gray-700 font-semibold">?</kbd>
        </div>
        <div class="flex items-center justify-between py-2 px-2.5 rounded-xl hover:bg-slate-50 dark:hover:bg-gray-800/40">
          <span class="text-slate-600 dark:text-gray-300">Close Dialog / Unfocus</span>
          <kbd class="font-mono bg-slate-100 dark:bg-gray-800 px-2 py-0.5 rounded text-[11px] border border-slate-200 dark:border-gray-700 font-semibold">Esc</kbd>
        </div>
      </div>
      <div class="pt-3 border-t border-slate-100 dark:border-gray-800 text-[11px] text-slate-400 dark:text-gray-500 text-center">
        Press <kbd class="font-mono font-semibold text-slate-600 dark:text-gray-300">Esc</kbd> to dismiss
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', path='js/search.js') }}"></script>
  <script>
    // Global toast helper
    window.showToast = function(msg, type = 'info', duration = 3200) {
      window.dispatchEvent(new CustomEvent('show-toast', { detail: { msg, type, duration } }));
    };

    // Global copy to clipboard helper
    window.copyToClipboard = function(text, label = 'Copied to clipboard!') {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => {
          window.showToast(label, 'success');
        }).catch(() => {
          window.showToast('Could not copy to clipboard', 'warning');
        });
      }
    };

    let lastKey = null;
    let lastKeyTime = 0;
    document.addEventListener('keydown', (e) => {
      // ⌘K or Ctrl+K search focus
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        const hero = document.getElementById('ticker-input');
        const nav = document.getElementById('nav-search-input');
        const target = hero || nav;
        if (target) {
          target.focus();
          target.select();
        }
        return;
      }

      // Ignore shortcuts if user is typing in form inputs
      const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
      if (['input', 'textarea', 'select'].includes(activeTag) || (document.activeElement && document.activeElement.isContentEditable)) {
        return;
      }

      const now = Date.now();
      if (e.key === '?' || (e.key === '/' && !e.metaKey && !e.ctrlKey)) {
        e.preventDefault();
        window.dispatchEvent(new CustomEvent('toggle-shortcuts'));
      } else if (e.key.toLowerCase() === 't') {
        e.preventDefault();
        const current = localStorage.getItem('tickerlens_theme') || 'system';
        const next = current === 'system' ? 'light' : (current === 'light' ? 'dark' : 'system');
        localStorage.setItem('tickerlens_theme', next);
        const isDark = (next === 'dark') || (next === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        window.dispatchEvent(new CustomEvent('theme-changed', { detail: { theme: next, isDark } }));
        window.showToast(`Theme switched to ${next.toUpperCase()}`, 'info');
      } else if (e.key.toLowerCase() === 'h' && lastKey === 'g' && (now - lastKeyTime < 1000)) {
        e.preventDefault();
        window.location.href = '/';
      }

      lastKey = e.key.toLowerCase();
      lastKeyTime = now;
    });

    // Wire body htmx-request class for progress bar
    document.addEventListener('htmx:beforeRequest', () => {
      document.body.classList.add('htmx-request');
    });
    document.addEventListener('htmx:afterOnLoad', () => {
      document.body.classList.remove('htmx-request');
    });
    document.addEventListener('htmx:sendError', () => {
      document.body.classList.remove('htmx-request');
    });
  </script>
</body>
</html>
