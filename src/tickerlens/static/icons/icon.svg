<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1017"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Aura -->
  <rect x="76" y="76" width="360" height="360" rx="90" fill="#6366f1" opacity="0.2" filter="url(#glow)"/>

  <!-- Badge Container -->
  <rect x="86" y="86" width="340" height="340" rx="80" fill="url(#badgeGrad)" stroke="#818cf8" stroke-width="4" stroke-opacity="0.5"/>

  <!-- Top Glass Highlight -->
  <path d="M 86,166 C 86,120 120,86 166,86 L 346,86 C 392,86 426,120 426,166 C 350,190 200,210 86,166 Z" fill="#ffffff" opacity="0.12"/>

  <!-- Brand Typography: TL -->
  <text x="256" y="310" 
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'JetBrains Mono', sans-serif" 
        font-size="180" 
        font-weight="800" 
        letter-spacing="-6"
        fill="#ffffff" 
        text-anchor="middle">TL</text>

  <!-- Financial Metric Dot Accent -->
  <circle cx="376" cy="140" r="14" fill="#10b981" stroke="#ffffff" stroke-width="3"/>
</svg>
