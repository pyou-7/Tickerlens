<!DOCTYPE html>
<html lang="en" class="h-full bg-[#090a0f]">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tickerlens</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #090a0f;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .logo-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .glow {
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.4) 0%, rgba(99, 102, 241, 0) 70%);
      animation: pulse 2.5s ease-in-out infinite;
    }
    .badge {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 24px;
      background: linear-gradient(135deg, #6366f1, #4338ca);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4), 0 8px 10px -6px rgba(99, 102, 241, 0.2);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
    }
    .badge span {
      font-size: 32px;
      font-weight: 800;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      letter-spacing: -1px;
    }
    .brand-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .brand-subtitle {
      font-size: 11px;
      font-weight: 600;
      color: #818cf8;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 32px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }
    .error-box {
      display: none;
      margin-top: 20px;
      text-align: center;
      max-width: 280px;
    }
    .retry-btn {
      margin-top: 12px;
      padding: 10px 20px;
      border-radius: 12px;
      background: #6366f1;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="glow"></div>
    <div class="badge">
      <span>TL</span>
    </div>
  </div>
  <div class="brand-title">Tickerlens</div>
  <div class="brand-subtitle">Financial Intelligence</div>
  <div class="spinner" id="loader"></div>
  <div class="error-box" id="errorBox">
    <p style="font-size: 12px; color: #94a3b8; margin: 0 0 12px;">Unable to connect to local server.</p>
    <button class="retry-btn" onclick="connect()">Retry</button>
  </div>

  <script>
    // Automatically redirect native container to server endpoint
    function connect() {
      document.getElementById('errorBox').style.display = 'none';
      document.getElementById('loader').style.display = 'block';
      const targetUrl = window.location.origin.includes('localhost') 
        ? 'http://localhost:8000/' 
        : '/';
      
      fetch(targetUrl, { method: 'HEAD', mode: 'no-cors' })
        .then(() => {
          window.location.replace(targetUrl);
        })
        .catch(() => {
          setTimeout(() => {
            // Retry once before displaying error
            window.location.replace(targetUrl);
          }, 1000);
        });
    }
    // Launch connection immediately
    connect();
  </script>
</body>
</html>
